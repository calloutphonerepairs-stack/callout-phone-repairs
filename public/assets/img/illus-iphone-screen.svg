<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" fill="none">
  <title>An iPhone-style handset with a cracked screen and a new replacement display ready to fit</title>
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B4FD0"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
    <radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ECE9FB"/><stop offset="1" stop-color="#F5F3FF" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="180" cy="200" r="180" fill="url(#h)"/>
  <!-- cracked phone (back) -->
  <g transform="rotate(-10 120 210)">
    <rect x="50" y="60" width="150" height="300" rx="34" fill="#0B1026"/>
    <rect x="58" y="68" width="134" height="284" rx="27" fill="#1E2550"/>
    <rect x="103" y="78" width="44" height="14" rx="7" fill="#0B1026"/>
    <path d="M150 170l-22 26 14 22-30 30 10 26M128 196l-38 6M142 218l38 10M112 248l-24 30M122 274l40 30" stroke="#C9C2F2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- new screen -->
  <g transform="rotate(8 240 200)">
    <rect x="166" y="46" width="150" height="300" rx="34" fill="#0B1026"/>
    <rect x="174" y="54" width="134" height="284" rx="27" fill="url(#s)"/>
    <rect x="219" y="64" width="44" height="14" rx="7" fill="#0B1026"/>
    <circle cx="241" cy="190" r="30" fill="#FFFFFF" opacity=".14"/>
    <path d="M227 190l10 10 20-22" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M196 262h90M196 280h60" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <path d="M318 74v20M308 84h20" stroke="#7C4DDB" stroke-width="4" stroke-linecap="round"/>
</svg>
