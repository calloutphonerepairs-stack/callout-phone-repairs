<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" fill="none">
  <title>Phone screen replacement in progress: the new display lifted above the phone, with repair tools</title>
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B4FD0"/><stop offset=".55" stop-color="#3B3FC4"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#ECE9FB" stop-opacity=".6"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AA0C4"/><stop offset=".5" stop-color="#E4E6F5"/><stop offset="1" stop-color="#9AA0C4"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ECE9FB"/><stop offset="1" stop-color="#F5F3FF" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="240" cy="220" r="210" fill="url(#halo)"/>
  <!-- repair mat grid -->
  <g stroke="#DCD7F5" stroke-width="1">
    <path d="M60 330h360M80 352h320M104 374h272"/>
  </g>
  <!-- phone body (open) -->
  <g transform="rotate(-8 230 250)">
    <rect x="150" y="120" width="170" height="300" rx="30" fill="#0B1026"/>
    <rect x="160" y="130" width="150" height="280" rx="22" fill="#151B3D"/>
    <!-- internals -->
    <rect x="176" y="150" width="118" height="70" rx="8" fill="#2A3160"/>
    <rect x="186" y="160" width="40" height="28" rx="4" fill="#3B3FC4"/>
    <rect x="234" y="160" width="50" height="10" rx="3" fill="#7C4DDB"/>
    <rect x="234" y="176" width="34" height="8" rx="3" fill="#A78BFA"/>
    <circle cx="203" cy="204" r="6" fill="#C9CDEA"/><circle cx="222" cy="204" r="6" fill="#C9CDEA"/>
    <rect x="176" y="232" width="118" height="140" rx="10" fill="#1E2550"/>
    <rect x="186" y="244" width="98" height="116" rx="8" fill="#2A3160" stroke="#3B3FC4" stroke-width="2"/>
    <path d="M200 300h70M200 314h50" stroke="#4B4FD0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="186" cy="386" r="4" fill="#9AA0C4"/><circle cx="284" cy="386" r="4" fill="#9AA0C4"/>
  </g>
  <!-- new screen lifted above -->
  <g transform="translate(40 -12) rotate(-18 300 180)">
    <rect x="230" y="40" width="160" height="290" rx="28" fill="#0B1026"/>
    <rect x="238" y="48" width="144" height="274" rx="22" fill="url(#scr)"/>
    <rect x="238" y="48" width="144" height="274" rx="22" fill="url(#glass)" opacity=".18"/>
    <rect x="292" y="58" width="36" height="10" rx="5" fill="#0B1026"/>
    <circle cx="310" cy="176" r="34" fill="#FFFFFF" opacity=".14"/>
    <path d="M294 176l11 11 22-24" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M262 250h96M262 268h66" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
    <!-- flex cable -->
    <path d="M250 322c-10 18-30 22-44 30" stroke="#7C4DDB" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- suction cup -->
  <g transform="translate(386 248)">
    <ellipse cx="0" cy="22" rx="34" ry="11" fill="#A78BFA" opacity=".55"/>
    <path d="M-30 20c6-22 54-22 60 0z" fill="#7C4DDB"/>
    <rect x="-6" y="-26" width="12" height="34" rx="6" fill="#5B3CC4"/>
    <circle cx="0" cy="-28" r="12" fill="#3B3FC4"/>
  </g>
  <!-- screwdriver -->
  <g transform="rotate(32 92 270)">
    <rect x="60" y="250" width="22" height="78" rx="10" fill="#3B3FC4"/>
    <rect x="64" y="256" width="4" height="64" rx="2" fill="#4B4FD0"/>
    <rect x="67" y="200" width="8" height="54" rx="3" fill="url(#metal)"/>
    <path d="M67 200l4-12 4 12z" fill="#9AA0C4"/>
  </g>
  <!-- spudger + screws -->
  <rect x="96" y="356" width="104" height="10" rx="5" transform="rotate(-10 96 356)" fill="#0B1026"/>
  <circle cx="232" cy="384" r="5" fill="#9AA0C4"/><circle cx="250" cy="392" r="4" fill="#9AA0C4"/><circle cx="268" cy="384" r="5" fill="#9AA0C4"/>
  <!-- location pin: we come to you -->
  <g transform="translate(110 132)">
    <circle r="36" fill="#7C4DDB"/>
    <path d="M0-18a14 14 0 0 1 14 14c0 11-14 24-14 24S-14 7-14-4A14 14 0 0 1 0-18z" fill="#FFFFFF"/>
    <circle cy="-4" r="5" fill="#7C4DDB"/>
  </g>
</svg>
