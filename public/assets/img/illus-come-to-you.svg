<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 204" fill="none" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <title>We come to you: from your enquiry, to an agreed visit at your home or work, to a repaired phone</title>
  <rect width="640" height="200" rx="24" fill="#F5F3FF"/>
  <path d="M120 100C200 40 260 160 330 100S470 50 520 100" stroke="#A78BFA" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- phone with message -->
  <g transform="translate(70 52)">
    <rect width="56" height="96" rx="12" fill="#0B1026"/>
    <rect x="5" y="6" width="46" height="84" rx="8" fill="#3B3FC4"/>
    <rect x="11" y="18" width="30" height="10" rx="5" fill="#FFFFFF" opacity=".85"/>
    <rect x="17" y="34" width="28" height="10" rx="5" fill="#A78BFA"/>
    <rect x="11" y="50" width="22" height="10" rx="5" fill="#FFFFFF" opacity=".85"/>
  </g>
  <!-- tool bag -->
  <g transform="translate(292 70)">
    <rect y="14" width="76" height="52" rx="10" fill="#7C4DDB"/>
    <path d="M22 14v-6a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v6" stroke="#5B3CC4" stroke-width="6"/>
    <rect x="30" y="32" width="16" height="12" rx="3" fill="#FFFFFF"/>
  </g>
  <!-- home -->
  <g transform="translate(500 56)">
    <path d="M0 40L44 4l44 36v52H0z" fill="#FFFFFF" stroke="#0B1026" stroke-width="5" stroke-linejoin="round"/>
    <rect x="34" y="56" width="20" height="36" rx="3" fill="#3B3FC4"/>
    <g transform="translate(76 -2)"><circle r="18" fill="#7C4DDB"/><path d="M0-9a7 7 0 0 1 7 7c0 6-7 12-7 12s-7-6-7-12a7 7 0 0 1 7-7z" fill="#FFFFFF"/></g>
  </g>
  <g font-size="18" font-weight="700" fill="#0B1026" text-anchor="middle">
    <text x="100" y="184">You message us</text>
    <text x="314" y="184">We travel to you</text>
    <text x="518" y="184">Repaired at home or work</text>
  </g>
</svg>
